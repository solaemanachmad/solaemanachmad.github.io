project:
  type: website
  output-dir: _site
  resources:
    - assets/images/
    # Slide PDF & thumbnail yang disimpan di folder mata kuliah
    - "courses/**/*.pdf"
    - "courses/**/thumbs/*"

website:
  title: "Achmad Solaeman"
  description: "Junior Lecturer in Internet Engineering Technology, Universitas Gadjah Mada. Deep learning, computer vision, and eye tracking."
  site-url: "https://solaemanachmad.github.io"
  favicon: assets/images/profile.jpg
  open-graph: true
  page-navigation: false
  navbar:
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: teaching.qmd
        text: Teaching
      - href: services.qmd
        text: Services
      - href: posts.qmd
        text: Posts
  page-footer:
    left: "© 2026 Achmad Solaeman"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, assets/styles/theme.scss]
      dark: [cosmo, assets/styles/theme.scss, assets/styles/theme-dark.scss]
    toc: false
    respect-user-color-scheme: true
    smooth-scroll: true
    link-external-newwindow: true
    link-external-icon: false
    # Ikon Google Scholar & ORCID (Academicons)
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.4/css/academicons.min.css">
    # Kolom profil kiri, tampil di setiap halaman. Edit link-nya di _includes/profile.html
    include-before-body:
      - _includes/profile.html
    # Jendela preview (slide & CV) dan tombol Grid/List, dipakai di banyak halaman
    include-after-body:
      - _includes/deck-viewer.html
      - _includes/view-toggle.html
