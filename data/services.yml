  kind: "PkM"
  summary: "A community service program by the Department of Electrical Engineering and Informatics (DTEDI), Vocational College UGM, delivering an IoT Smart School training module aligned with Kurikulum Merdeka, a lab-scale trainer kit, and a project-based workshop for students."
