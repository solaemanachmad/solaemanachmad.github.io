- role: peer-review
  year: "Ongoing"
  period: "Ongoing"   # ganti dengan mis. "2025–present" bila tahun mulainya diketahui
  title: "Reviewer"
  venue: "Journal of Internet and Software Engineering (JISE)"
  url: "https://jurnal.ugm.ac.id/v3/JISE/"
  kind: "Journal"
- role: community-service
  year: 2026
  title: "Community Service Team — IoT-based Smart School Learning for Vocational High School Students"
  venue: "SMK Negeri 2 Depok, Sleman · with PT Lifemedia Yogyakarta"
