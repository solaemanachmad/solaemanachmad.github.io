#   location: kota atau "Online" (opsional)
#   date:     tanggal mulai YYYY-MM-DD atau YYYY-MM — untuk urutan (wajib)
#   period:   teks periode yang tampil, mis. "10/2018 – 12/2018" (opsional; bawaan = tahun dari date)
