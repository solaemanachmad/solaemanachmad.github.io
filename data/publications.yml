# Daftar publikasi untuk halaman Publications (dikelompokkan per `year`, terbaru di atas).
# Field:
#   year:      tahun terbit
#   title:     judul;   url: link paper (DOI atau halaman penerbit)
#   authors:   daftar penulis sesuai urutan di paper (nama Anda otomatis ditebalkan)
#   venue:     nama jurnal/konferensi;   publisher: penerbit
#   kind:      Journal article / Conference paper / Book review / Book chapter / ...
#              (filter di halaman: Journal = "Journal article", Conference = "Conference paper", sisanya Other)
#   doi:       DOI tanpa https://doi.org/  (untuk tombol DOI, sitasi, dan data Google Scholar)
#   pages:     halaman, mis. "161-164" (opsional);   volume / issue (opsional)
#   summary:   ringkasan 1–2 kalimat (muncul lewat tombol "Summary")
# Catatan: file ini satu-satunya sumber. cv/_sections/publications.qmd (CV PDF & halaman CV) dibuat
#   otomatis dari file ini oleh scripts/build_cv_sections.py saat render — jangan edit file .qmd itu.
#   Publikasi yang sengaja TIDAK ditampilkan dicatat di data/publications-ignore.yml
#   (agar sinkronisasi ORCID mingguan tidak menambahkannya lagi).
