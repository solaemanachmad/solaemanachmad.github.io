# Daftar publikasi untuk halaman Publications (urutan bebas; dikelompokkan per `year`).
# Field:
#   year, title, url (link paper/DOI), venue, kind (Conference paper / Journal article / Book review / ...),
#   publisher, summary (1–2 kalimat)
# Catatan: file ini satu-satunya sumber. cv/_sections/publications.qmd (CV PDF & halaman CV) dibuat
