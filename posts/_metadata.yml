# ---- Komentar pembaca (giscus, memakai GitHub Discussions) ----
# Repo sudah public. Langkah aktivasi (sekali saja):
#   1. GitHub repo → Settings → General → Features → centang "Discussions".
#   2. Tab Discussions → kategori (ikon pensil) → New category: nama "Comments",
#      format "Announcement" (hanya Anda & giscus yang membuat thread baru; pengunjung tetap bisa membalas).
#   3. Pasang aplikasi giscus untuk repo ini: https://github.com/apps/giscus
#   4. Hapus tanda # pada blok di bawah, juga blok yang sama di index.qmd (About).
