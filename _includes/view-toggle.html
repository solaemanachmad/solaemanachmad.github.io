<script>
  // Tombol Grid / List. Tiap halaman punya pilihan sendiri (data-key) dan bawaan sendiri
  // (data-default, mis. Publications = list) lewat .view-config atau atribut di .view-toolbar. Pilihan pembaca diingat di browser.
  (function () {
    var bar = document.querySelector(".view-toolbar");
    if (!bar) return;
    // Pengaturan per halaman: <div class="view-config" data-key=".." data-default="list|grid">
    var cfg = document.querySelector(".view-config") || bar;
    var KEY = "view-" + (cfg.dataset.key || "default");
    function apply(view) {
      document.body.classList.toggle("view-list", view === "list");
      document.querySelectorAll(".view-btn").forEach(function (b) {
        var on = b.dataset.view === view;
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    apply(saved || cfg.dataset.default || "grid");
    document.addEventListener("click", function (e) {
      var b = e.target.closest(".view-btn");
      if (!b) return;
      apply(b.dataset.view);
      try { localStorage.setItem(KEY, b.dataset.view); } catch (err) {}
    });
  })();

  // Tab semester di halaman mata kuliah: tampilkan pertemuan semester terpilih + yang berlaku umum
  (function () {
    var tabs = document.querySelectorAll(".sem-tab");
    if (!tabs.length) return;
    function show(sem) {
      tabs.forEach(function (t) {
        var on = t.dataset.sem === sem;
        t.classList.toggle("active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
      });
      document.querySelectorAll(".deck-card[data-sem]").forEach(function (c) {
        c.hidden = !(c.dataset.sem === "all" || c.dataset.sem === sem);
      });
    }
    tabs.forEach(function (t) { t.addEventListener("click", function () { show(t.dataset.sem); }); });
    show(tabs[0].dataset.sem);
  })();

  // Penanda pertemuan: "This week" / "Done" / "Up next" + progres semester.
  // Tanggal: data-date per kartu (field `date` di meetings.yml), atau `start` mata kuliah + 7 hari per pertemuan.
  (function () {
    var box = document.querySelector(".course-progress");
    var cards = Array.prototype.slice.call(document.querySelectorAll(".deck-card[data-meeting]"));
    if (!box || !cards.length) return;
    var DAY = 864e5;
    function parse(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3]) : null; }
    var start = parse(box.dataset.start);
    var dated = cards.map(function (c) {
      var d = parse(c.dataset.date) || (start ? new Date(start.getTime() + (Number(c.dataset.meeting) - 1) * 7 * DAY) : null);
      return { el: c, date: d, n: Number(c.dataset.meeting) };
    }).filter(function (x) { return x.date; });
    if (!dated.length) return;
    var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var fmt = function (d) { return d.getDate() + " " + MON[d.getMonth()]; };
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var current = null, next = null, done = 0;
    dated.forEach(function (x, i) {
      var end = i + 1 < dated.length ? dated[i + 1].date : new Date(x.date.getTime() + 7 * DAY);
      x.el.querySelector(".deck-date").textContent = " · " + fmt(x.date);
      if (today >= end) { x.el.classList.add("is-done"); done++; }
      else if (today >= x.date) { current = x; }
      else if (!next) { next = x; }
    });
    function badge(x, text, cls) {
      x.el.classList.add(cls);
      var s = x.el.querySelector(".deck-status"); s.textContent = text; s.className = "deck-status " + cls;
    }
    var total = cards.length, html;
    if (current) {
      badge(current, "This week", "is-current");
      html = '<span class="cp-label">This week</span><a href="#meeting-' + current.n + '">Meeting ' + current.n + " · " +
        current.el.querySelector(".deck-title").textContent.trim() + "</a>";
    } else if (next && done === 0) {
      badge(next, "Up next", "is-next");
      html = '<span class="cp-label">Starts</span><a href="#meeting-' + next.n + '">' + fmt(next.date) + "</a>";
    } else if (next) {
      badge(next, "Up next", "is-next");
      html = '<span class="cp-label">Up next</span><a href="#meeting-' + next.n + '">Meeting ' + next.n + " · " + fmt(next.date) + "</a>";
    } else {
      html = '<span class="cp-label">Completed</span><span>All ' + total + " meetings done</span>";
    }
    var pos = current ? current.n : done;
    box.innerHTML = '<div class="cp-text">' + html + '<span class="cp-count">' + pos + " / " + total + '</span></div>' +
      '<div class="cp-bar"><span style="width:' + Math.round(100 * pos / total) + '%"></span></div>';
    box.hidden = false;
  })();
</script>
