# Setiap Senin: cek ORCID, tambahkan publikasi baru (dilengkapi dari Crossref: penulis, venue,
# halaman, ringkasan dari abstrak) LANGSUNG ke data/publications.yml di branch main, lalu
# menjalankan "Publish CV site" agar situs & CV ikut diperbarui. Tanpa Pull Request.
#
# Tidak setuju dengan entri yang ditambahkan? Edit/hapus di data/publications.yml, atau catat
# DOI-nya di data/publications-ignore.yml agar tidak ditambahkan lagi.
#
# Perlu (sekali): Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions".
name: ORCID sync

on:
  schedule:
    - cron: "0 1 * * 1"   # every Monday 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit ke main
  actions: write    # menjalankan workflow "Publish CV site"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Fetch new works from ORCID (+ Crossref)
        run: python3 scripts/orcid_sync.py | tee orcid-sync.log

      - name: Commit new publications to main
        id: commit
        run: |
          if git diff --quiet -- data/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new publications." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.yml
          git commit -m "Add new publications from ORCID"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          { echo "### New publications added"; echo '```'; cat orcid-sync.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Push dengan GITHUB_TOKEN tidak memicu workflow lain, jadi publish dijalankan manual di sini.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
